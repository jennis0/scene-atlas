<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene Atlas — Filter Panel Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Figtree:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         hsl(222, 22%, 8%);
    --card:       hsl(222, 22%, 12%);
    --card2:      hsl(222, 22%, 14%);
    --secondary:  hsl(222, 20%, 17%);
    --border:     hsl(220, 18%, 19%);
    --border2:    hsl(220, 18%, 23%);
    --fg:         hsl(37, 27%, 89%);
    --muted:      hsl(37, 8%, 50%);
    --primary:    hsl(38, 60%, 58%);
    --primary-bg: hsl(38, 60%, 58%, 0.12);
    --primary-dk: hsl(222, 30%, 8%);
    --destructive: hsl(0, 62%, 57%);
    --r: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Figtree', system-ui, sans-serif;
    background-image: radial-gradient(circle, hsl(37 27% 89% / 0.04) 1px, transparent 1px);
    background-size: 28px 28px;
    padding: 48px 40px;
    display: flex;
    gap: 48px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, hsl(38 60% 58% / 0.5) 15%, hsl(38 60% 58%) 50%, hsl(38 60% 58% / 0.5) 85%, transparent);
    z-index: 100;
  }

  .label {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 12px;
  }

  /* ── The panel shell ─────────────────────────────────── */
  .panel {
    width: 400px;
    height: 440px;
    background: var(--card);
    border: 1px solid var(--border2);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 0 0 1px hsl(38 60% 58% / 0.04),
      0 8px 32px hsl(222 30% 4% / 0.6),
      0 2px 8px hsl(222 30% 4% / 0.4);
    /* Subtle dot grid inside the panel too */
    background-image: radial-gradient(circle, hsl(37 27% 89% / 0.025) 1px, transparent 1px);
    background-size: 24px 24px;
    background-color: var(--card);
  }

  /* ── Header ──────────────────────────────────────────── */
  .panel-header {
    flex-shrink: 0;
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .panel-title-block {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .panel-title {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--fg);
    line-height: 1;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .panel-title svg { color: var(--muted); }
  .panel-title-rule {
    width: 28px;
    height: 1px;
    background: linear-gradient(90deg, var(--primary) 0%, transparent 100%);
  }
  .active-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 18px;
    padding: 0 7px;
    background: var(--primary-bg);
    border: 1px solid hsl(38 60% 58% / 0.25);
    border-radius: 100px;
    font-size: 10px;
    font-weight: 600;
    color: var(--primary);
    font-family: 'Figtree', sans-serif;
  }
  .clear-btn {
    background: transparent;
    border: none;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Figtree', sans-serif;
    transition: color 0.15s;
    padding: 2px 0;
  }
  .clear-btn:hover { color: var(--fg); }

  /* ── Filter search ───────────────────────────────────── */
  .panel-search {
    flex-shrink: 0;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .panel-search svg {
    position: absolute;
    left: 22px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  .panel-search input {
    width: 100%;
    height: 30px;
    padding: 0 28px;
    background: var(--secondary);
    border: 1px solid var(--border);
    border-radius: var(--r);
    color: var(--fg);
    font-family: 'Figtree', sans-serif;
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .panel-search input::placeholder { color: var(--muted); }
  .panel-search input:focus {
    border-color: hsl(38 60% 58% / 0.4);
    box-shadow: 0 0 0 2px hsl(38 60% 58% / 0.08);
  }

  /* ── Two-column body ─────────────────────────────────── */
  .panel-body {
    flex: 1;
    min-height: 0;
    display: flex;
    overflow: hidden;
  }

  /* Left nav */
  .panel-nav {
    width: 116px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 6px 0;
    background: hsl(222 22% 10%);
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 100%;
    padding: 7px 10px 7px 12px;
    background: transparent;
    border: none;
    border-left: 2px solid transparent;
    text-align: left;
    font-family: 'Figtree', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
    color: var(--muted);
  }
  .nav-item:hover { color: var(--fg); background: hsl(222 20% 14%); }
  .nav-item.active {
    color: var(--fg);
    background: hsl(222 20% 15%);
    border-left-color: var(--primary);
    font-weight: 500;
  }
  .nav-item.active-cat-green { border-left-color: hsl(142 60% 50%); color: hsl(142 55% 75%); background: hsl(142 30% 12%); }
  .nav-item.active-cat-blue { border-left-color: hsl(210 80% 58%); color: hsl(210 70% 78%); background: hsl(210 40% 12%); }
  .nav-item.active-cat-amber { border-left-color: hsl(38 80% 58%); color: hsl(38 70% 75%); background: hsl(38 40% 11%); }

  .nav-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .nav-label { flex: 1; truncate: ellipsis; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-count {
    font-size: 10px;
    font-weight: 600;
    flex-shrink: 0;
    color: var(--muted);
  }
  .nav-count.active-count { color: var(--primary); }

  .nav-divider { height: 1px; background: var(--border); margin: 4px 8px; }

  /* Right panel */
  .panel-content {
    flex: 1;
    overflow-y: auto;
    min-width: 0;
    padding: 0;
  }

  .content-section { padding: 12px 14px 10px; }
  .content-section + .content-section { padding-top: 8px; }

  .section-heading {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* Pills */
  .pills { display: flex; flex-wrap: wrap; gap: 5px; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 24px;
    padding: 0 10px;
    border-radius: 100px;
    font-size: 11.5px;
    font-family: 'Figtree', sans-serif;
    cursor: pointer;
    border: 1px solid;
    transition: filter 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .pill:hover { filter: brightness(1.15); }

  /* Inactive pills — category-colored */
  .pill-inactive-green {
    background: hsl(142 60% 50% / 0.1);
    border-color: hsl(142 60% 50% / 0.25);
    color: hsl(142 55% 75%);
  }
  .pill-inactive-blue {
    background: hsl(210 80% 58% / 0.1);
    border-color: hsl(210 80% 58% / 0.25);
    color: hsl(210 70% 78%);
  }
  .pill-inactive-amber {
    background: hsl(38 80% 58% / 0.1);
    border-color: hsl(38 80% 58% / 0.25);
    color: hsl(38 70% 78%);
  }
  .pill-inactive-default {
    background: hsl(220 20% 18%);
    border-color: hsl(220 20% 25%);
    color: var(--muted);
  }
  .pill-inactive-default:hover { color: var(--fg); }

  /* Active include */
  .pill-include {
    background: hsl(38 60% 58% / 0.18);
    border-color: hsl(38 60% 58% / 0.45);
    color: var(--primary);
    font-weight: 500;
  }

  /* Active exclude */
  .pill-exclude {
    background: hsl(0 62% 57% / 0.1);
    border-color: hsl(0 62% 57% / 0.3);
    color: hsl(0 62% 75%);
    text-decoration: line-through;
    opacity: 0.8;
  }

  .pill-icon { width: 11px; height: 11px; flex-shrink: 0; }

  .pill-count { font-size: 9.5px; opacity: 0.5; margin-left: 1px; }

  /* Color swatches */
  .swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .swatch {
    aspect-ratio: 1;
    border-radius: 5px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.15s;
  }
  .swatch:hover { transform: scale(1.1); }
  .swatch.selected {
    box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--primary);
    transform: scale(1.08);
  }

  /* ── Footer ──────────────────────────────────────────── */
  .panel-footer {
    flex-shrink: 0;
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: hsl(222 22% 10%);
  }
  .footer-hint {
    font-size: 10.5px;
    color: var(--muted);
    font-style: italic;
  }
  .footer-clear {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 26px;
    padding: 0 10px;
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: var(--r);
    font-family: 'Figtree', sans-serif;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .footer-clear:hover { color: var(--fg); border-color: hsl(220 18% 30%); }
</style>
</head>
<body>

<!-- ═══ PANEL A: No active filters — at rest ═══ -->
<div>
  <div class="label">At rest — no active filters</div>
  <div class="panel">
    <!-- Header -->
    <div class="panel-header">
      <div class="panel-title-block">
        <div class="panel-title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="12" y1="18" x2="20" y2="18"/></svg>
          Filters
        </div>
        <div class="panel-title-rule"></div>
      </div>
    </div>

    <!-- Search -->
    <div class="panel-search">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Search filters…">
    </div>

    <!-- Body -->
    <div class="panel-body">
      <!-- Nav -->
      <div class="panel-nav">
        <button class="nav-item active">
          <span class="nav-label">All</span>
        </button>
        <div class="nav-divider"></div>
        <button class="nav-item">
          <span class="nav-label">Author</span>
        </button>
        <button class="nav-item">
          <span class="nav-label">Grid</span>
        </button>
        <div class="nav-divider"></div>
        <button class="nav-item">
          <span class="nav-dot" style="background:hsl(142 60% 50%)"></span>
          <span class="nav-label">Biome</span>
        </button>
        <button class="nav-item">
          <span class="nav-dot" style="background:hsl(210 80% 58%)"></span>
          <span class="nav-label">Setting</span>
        </button>
        <button class="nav-item">
          <span class="nav-dot" style="background:hsl(38 80% 58%)"></span>
          <span class="nav-label">Mood</span>
        </button>
        <button class="nav-item">
          <span class="nav-dot" style="background:hsl(270 60% 65%)"></span>
          <span class="nav-label">Style</span>
        </button>
        <div class="nav-divider"></div>
        <button class="nav-item">
          <span class="nav-label">Color</span>
        </button>
      </div>

      <!-- Content -->
      <div class="panel-content">
        <div class="content-section">
          <div class="section-heading" style="color: hsl(142 55% 75%)">Biome</div>
          <div class="pills">
            <button class="pill pill-inactive-green">Forest <span class="pill-count">142</span></button>
            <button class="pill pill-inactive-green">Mountain <span class="pill-count">89</span></button>
            <button class="pill pill-inactive-green">Coastal <span class="pill-count">67</span></button>
            <button class="pill pill-inactive-green">Desert <span class="pill-count">54</span></button>
            <button class="pill pill-inactive-green">Swamp <span class="pill-count">41</span></button>
            <button class="pill pill-inactive-green">Arctic <span class="pill-count">28</span></button>
            <button class="pill pill-inactive-green">Jungle <span class="pill-count">35</span></button>
          </div>
        </div>
        <div class="content-section">
          <div class="section-heading" style="color: hsl(210 70% 78%)">Setting</div>
          <div class="pills">
            <button class="pill pill-inactive-blue">Dungeon <span class="pill-count">203</span></button>
            <button class="pill pill-inactive-blue">Tavern <span class="pill-count">78</span></button>
            <button class="pill pill-inactive-blue">Ruins <span class="pill-count">91</span></button>
            <button class="pill pill-inactive-blue">Cave <span class="pill-count">56</span></button>
            <button class="pill pill-inactive-blue">City <span class="pill-count">112</span></button>
          </div>
        </div>
        <div class="content-section">
          <div class="section-heading" style="color: hsl(38 70% 78%)">Mood</div>
          <div class="pills">
            <button class="pill pill-inactive-amber">Dark <span class="pill-count">187</span></button>
            <button class="pill pill-inactive-amber">Vibrant <span class="pill-count">94</span></button>
            <button class="pill pill-inactive-amber">Serene <span class="pill-count">73</span></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══ PANEL B: Active filters + footer ═══ -->
<div>
  <div class="label">With active filters</div>
  <div class="panel">
    <!-- Header -->
    <div class="panel-header">
      <div class="panel-title-block">
        <div class="panel-title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="12" y1="18" x2="20" y2="18"/></svg>
          Filters
          <span class="active-badge">3 active</span>
        </div>
        <div class="panel-title-rule"></div>
      </div>
      <button class="clear-btn">Clear all</button>
    </div>

    <!-- Search -->
    <div class="panel-search">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Search filters…">
    </div>

    <!-- Body -->
    <div class="panel-body">
      <!-- Nav — active categories highlighted -->
      <div class="panel-nav">
        <button class="nav-item">
          <span class="nav-label">All</span>
          <span class="nav-count active-count">3</span>
        </button>
        <div class="nav-divider"></div>
        <button class="nav-item">
          <span class="nav-label">Author</span>
        </button>
        <button class="nav-item">
          <span class="nav-label">Grid</span>
        </button>
        <div class="nav-divider"></div>
        <button class="nav-item active-cat-green">
          <span class="nav-dot" style="background:hsl(142 60% 50%)"></span>
          <span class="nav-label">Biome</span>
          <span class="nav-count active-count">2</span>
        </button>
        <button class="nav-item active">
          <span class="nav-dot" style="background:hsl(210 80% 58%)"></span>
          <span class="nav-label">Setting</span>
          <span class="nav-count active-count">1</span>
        </button>
        <button class="nav-item">
          <span class="nav-dot" style="background:hsl(38 80% 58%)"></span>
          <span class="nav-label">Mood</span>
        </button>
        <button class="nav-item">
          <span class="nav-dot" style="background:hsl(270 60% 65%)"></span>
          <span class="nav-label">Style</span>
        </button>
        <div class="nav-divider"></div>
        <button class="nav-item">
          <span class="nav-label">Color</span>
        </button>
      </div>

      <!-- Content — Setting tab -->
      <div class="panel-content">
        <div class="content-section">
          <div class="section-heading" style="color: hsl(210 70% 78%)">Setting</div>
          <div class="pills">
            <!-- active include -->
            <button class="pill pill-include">
              <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
              Dungeon
            </button>
            <!-- active exclude -->
            <button class="pill pill-exclude">
              <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
              City
            </button>
            <button class="pill pill-inactive-blue">Tavern <span class="pill-count">78</span></button>
            <button class="pill pill-inactive-blue">Ruins <span class="pill-count">91</span></button>
            <button class="pill pill-inactive-blue">Cave <span class="pill-count">56</span></button>
            <button class="pill pill-inactive-blue">Temple <span class="pill-count">44</span></button>
            <button class="pill pill-inactive-blue">Ship <span class="pill-count">32</span></button>
            <button class="pill pill-inactive-blue">Sewer <span class="pill-count">19</span></button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="panel-footer">
      <span class="footer-hint">Right-click any filter to exclude</span>
      <button class="footer-clear">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Clear 3 filters
      </button>
    </div>
  </div>
</div>

<!-- ═══ PANEL C: Color swatches tab ═══ -->
<div>
  <div class="label">Color swatch section</div>
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title-block">
        <div class="panel-title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="12" y1="18" x2="20" y2="18"/></svg>
          Filters
        </div>
        <div class="panel-title-rule"></div>
      </div>
    </div>
    <div class="panel-search">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Search filters…">
    </div>
    <div class="panel-body">
      <div class="panel-nav">
        <button class="nav-item">
          <span class="nav-label">All</span>
        </button>
        <div class="nav-divider"></div>
        <button class="nav-item">
          <span class="nav-label">Author</span>
        </button>
        <button class="nav-item">
          <span class="nav-label">Grid</span>
        </button>
        <div class="nav-divider"></div>
        <button class="nav-item">
          <span class="nav-dot" style="background:hsl(142 60% 50%)"></span>
          <span class="nav-label">Biome</span>
        </button>
        <button class="nav-item">
          <span class="nav-dot" style="background:hsl(210 80% 58%)"></span>
          <span class="nav-label">Setting</span>
        </button>
        <button class="nav-item">
          <span class="nav-dot" style="background:hsl(38 80% 58%)"></span>
          <span class="nav-label">Mood</span>
        </button>
        <div class="nav-divider"></div>
        <button class="nav-item active">
          <span class="nav-label">Color</span>
        </button>
      </div>
      <div class="panel-content">
        <div class="content-section">
          <div class="section-heading" style="color: var(--muted)">Color</div>
          <div class="swatches">
            <div class="swatch selected" style="background:#c0392b" title="Deep Red"></div>
            <div class="swatch" style="background:#e67e22" title="Amber"></div>
            <div class="swatch" style="background:#f1c40f" title="Gold"></div>
            <div class="swatch" style="background:#2ecc71" title="Green"></div>
            <div class="swatch" style="background:#1abc9c" title="Teal"></div>
            <div class="swatch" style="background:#3498db" title="Blue"></div>
            <div class="swatch" style="background:#9b59b6" title="Purple"></div>
            <div class="swatch" style="background:#e91e63" title="Pink"></div>
            <div class="swatch" style="background:#795548" title="Brown"></div>
            <div class="swatch" style="background:#607d8b" title="Steel"></div>
            <div class="swatch" style="background:#ecf0f1" title="Pale"></div>
            <div class="swatch" style="background:#2c3e50" title="Dark Navy"></div>
            <div class="swatch" style="background:#1a1a1a" title="Black"></div>
            <!-- Add custom swatch -->
            <div class="swatch" style="background: var(--secondary); border: 2px dashed hsl(220 18% 28%); display:flex; align-items:center; justify-content:center; cursor:pointer;" title="Custom color">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="hsl(37 8% 50%)" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </div>
          </div>
        </div>
      </div>
    </div>

      <span class="footer-hint">Right-click to exclude a color</span>
