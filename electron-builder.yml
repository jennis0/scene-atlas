appId: com.sceneatlas.app
productName: Scene Atlas
copyright: Copyright © 2026 Scene Atlas

directories:
  output: dist-electron
  # icon.ico, icon.icns and icon.png (scripts/build/build_icons.py, design/brand.md)
  # are found here by name, for Windows, macOS and Linux.
  buildResources: assets

# Installers named without spaces (GitHub rewrites spaces in release asset names).
artifactName: Scene-Atlas-${version}-${arch}.${ext}

# Files to include in the app package
files:
  - electron/dist/**/*
  - electron/setup.html
  - electron/loading.html
  - electron/fonts/**/*
  - "!**/*.map"
# Production dependencies (only electron-updater) are added from node_modules by
# electron-builder; devDependencies never are.

# The PyInstaller --onedir output is bundled as a resource directory
# named 'sidecar'. At runtime: path.join(process.resourcesPath, 'sidecar', 'scene-atlas-backend[.exe]')
extraResources:
  - from: backend/pyinstaller/dist/scene-atlas-backend/
    to: sidecar
    filter:
      - "**/*"

# Chromium's own UI strings and, more importantly, the locale the renderer reports
# (navigator.language, the Intl default): with no .pak for the system locale it falls
# back to en-US. en-GB is here so UK systems keep UK date and number formats. The app
# itself is English only; dropping the other 53 saves ~47 MB installed.
electronLanguages:
  - en-US
  - en-GB

# Hardening (design/electron.md#fuses). The app never runs Node outside Electron, never
# needs --inspect or NODE_OPTIONS, and only loads its own asar, which is integrity-checked.
# The packaged-app tests drive it over --remote-debugging-port instead of --inspect.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Left on (Electron's default): without it file:// can't read inside app.asar, so
  # setup.html and loading.html fail with ERR_FILE_NOT_FOUND. Turning it off means
  # serving them from a custom protocol (protocol.handle) instead.
  grantFileProtocolExtraPrivileges: true

# Where the packaged app looks for updates (written into resources/app-update.yml). The
# builds run with --publish never, so this only makes electron-builder write the update
# metadata (latest.yml, latest-mac.yml, latest-linux.yml, blockmaps); the Release
# workflow's publish job uploads them with the installers (design/electron.md#updates).
publish:
  provider: github
  owner: jennis0
  repo: scene-atlas

# ── Windows ─────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  artifactName: Scene-Atlas-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# ── macOS ────────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch: [arm64]  # sidecar is built only on the arm64 runner
  category: public.app-category.utilities
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist

dmg:
  title: "Scene Atlas ${version}"

# ── Linux ────────────────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Graphics
