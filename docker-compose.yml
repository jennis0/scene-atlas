# Scene Atlas — Docker Compose
#
# Serves the API + frontend UI on a single port (default 8000).
# The frontend is built into the Docker image and served by the backend.
#
# Usage:
#   docker compose --profile cpu up -d       # CPU inference (published image)
#   docker compose --profile gpu up -d       # NVIDIA GPU inference (built from source)
#
# The CPU profile runs the image published with each release, so it needs only this file
# and a .env. Update it with `docker compose pull` (docs/deploy/server.md#updating).
# `docker compose --profile cpu up -d --build` builds it from a checkout instead.
#
# Configuration:
#   Copy .env.example to .env and edit to customise. All variables below
#   use ${VAR:-default} so .env overrides work without editing this file.
#
# Volumes:
#   - scene-atlas-data (named volume) — database, vector index, thumbnails.
#     Managed by the app; users should not need to touch this directly.
#   - images (bind mount) — original image library. Defaults to ./images
#     in the project root. Set IMAGE_DIR in .env to point elsewhere,
#     e.g. IMAGE_DIR=/mnt/nas/battlemaps
#
# See README.md and .env.example for full configuration reference.

x-common: &common
  # The user the container runs as; must be able to write IMAGE_DIR (`id -u` / `id -g`).
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  ports:
    - "${PORT:-8000}:8000"
  volumes:
    - scene-atlas-data:/app/data
    - ${IMAGE_DIR:-./images}:/app/images
    # Your own maps folder (LINKED_LIBRARY_DIR, a read-only mount) goes in a
    # docker-compose.override.yml, so updating this file keeps it (docs/deploy/server.md).
  environment: &common-env
    APP_DATA_DIR: /app/data
    IMAGE_LIBRARY_DIR: /app/images
    APP_MODE: server
    # Quoted as a whole: quotes inside the default would reach the app, and it isn't JSON.
    CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:8000"]}'
    # Proxies trusted to report the client IP; set to your proxy's address as seen
    # from the container (see docs/deploy/server.md).
    FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,::1}
    INFERENCE_DEVICE: ${INFERENCE_DEVICE:-auto}
    DEBUG: ${DEBUG:-false}
    # Daily check for a newer release, shown in Settings; false makes no request.
    CHECK_FOR_UPDATES: ${CHECK_FOR_UPDATES:-true}
  restart: unless-stopped

services:
  # CPU inference (default). Use: docker compose --profile cpu up -d
  scene-atlas:
    <<: *common
    # SCENE_ATLAS_VERSION pins a release (e.g. 0.2.0); unset follows the latest one.
    image: ghcr.io/jennis0/scene-atlas:${SCENE_ATLAS_VERSION:-latest}
    build:
      context: .
      network: host
    profiles:
      - cpu

  # NVIDIA GPU inference. Use: docker compose --profile gpu up -d
  # Requires: nvidia-container-toolkit installed on the host.
  # No GPU image is published: this one is always built from a checkout.
  scene-atlas-gpu:
    <<: *common
    image: scene-atlas-gpu:local
    pull_policy: build
    build:
      context: .
      network: host
      args:
        EXTRA: gpu
    environment:
      <<: *common-env
      INFERENCE_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu

volumes:
  scene-atlas-data:
