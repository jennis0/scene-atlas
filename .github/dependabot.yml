version: 2

# Weekly version updates; minor and patch bumps are grouped into one PR per
# directory, majors come one PR each. Security updates ignore the cooldown.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Kept in step with frontend/, where typescript-eslint supports TS < 6.1.
      - dependency-name: typescript
        versions: [">=6.1.0"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TS < 6.1.
      - dependency-name: typescript
        versions: [">=6.1.0"]

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docs:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
