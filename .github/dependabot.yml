version: 2

# Weekly version updates; minor and patch bumps are grouped into one PR per
# directory, majors come one PR each. Security updates ignore the cooldown.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Kept in step with frontend/, where typescript-eslint supports TS < 6.1.
      - dependency-name: typescript
        versions: [">=6.1.0"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TS < 6.1.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Tailwind 4 is a migration with a visual pass, and tailwind-merge 3 only knows
      # Tailwind 4's classes (design/status-and-roadmap.md, "Framework majors").
      - dependency-name: tailwindcss
        versions: [">=4.0.0"]
      - dependency-name: tailwind-merge
        versions: [">=3.0.0"]

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docs:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The image's Python and Node versions move together with CI, the release build and
  # .python-version/.nvmrc, which Dependabot can't do, and CI doesn't build the image.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
