name: E2E Tests

on:
  workflow_dispatch:

jobs:
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install Python dependencies
        run: uv sync --extra dev --extra cpu
      - name: Install root dependencies
        run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Cache ONNX models
        id: cache-onnx
        uses: actions/cache@v4
        with:
          path: data/models/small
          key: onnx-models-small-${{ hashFiles('backend/app/services/model_registry.py') }}
      - name: Download ONNX model from HuggingFace
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        run: uv run python scripts/models/setup_models.py
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: "true"
          E2E_IMAGE_KEY: ${{ secrets.E2E_IMAGE_KEY }}
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results/
          retention-days: 14
