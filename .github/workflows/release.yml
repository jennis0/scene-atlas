name: Release

# Manual-only release pipeline. Run this against main before tagging a release.
# Stages: full test suite → E2E → multi-platform Electron builds → publish.
#
# Workflow:
#   1. Merge PRs to main
#   2. Trigger this workflow manually against main
#   3. Wait for full tests + E2E + builds to pass
#   4. Download and verify artifacts
#   5. Re-run with publish=true and a version (e.g. 0.5.0); the publish job creates
#      the GitHub Release v<version> once all three builds have passed

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Releases'
        type: boolean
        default: false
      version:
        description: 'Version to release (e.g. 0.5.0) — only used when publish is true'
        type: string
        required: false
      # The upgrade test compares search results before and after updating
      # (design/testing.md#upgrade-test). Library problems always fail it.
      accept_search_changes:
        description: 'Accept changed search results in the upgrade test (needs a reason)'
        type: boolean
        default: false
      search_change_reason:
        description: 'Why search results changed — shown in the test report and the release notes'
        type: string
        required: false

# Read-only by default; the publish job asks for what it needs.
permissions:
  contents: read

jobs:
  # ── Stage 1: Full test suite ──────────────────────────────────────────────
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev --extra cpu
      - name: Backend lint
        run: uv run ruff check backend/
      - name: Backend format check
        run: uv run ruff format --check backend/
      - name: Backend unit tests
        run: uv run python -m pytest backend/tests/unit/ -v
      - name: Cache ONNX models (small)
        id: cache-onnx
        uses: actions/cache@v6
        with:
          path: data/models/small
          key: onnx-models-small-${{ hashFiles('backend/app/services/model_registry.py') }}
      - name: Download ONNX model
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        run: uv run python scripts/models/setup_models.py
        env:
          EMBEDDING_MODEL: small
      - name: Backend integration tests
        run: >
          uv run python -m pytest backend/tests/integration/ -v
          || test $? -eq 134
        env:
          EMBEDDING_MODEL: small
      - name: Backend heavy tests (real CLIP)
        run: uv run python -m pytest -m heavy -v

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npx eslint . --ext ts,tsx --report-unused-disable-directives --max-warnings 0
      - name: Prettier check
        working-directory: frontend
        run: npx prettier --check src/
      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Unit tests with coverage
        working-directory: frontend
        run: npx vitest run --coverage
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 14
      - name: Production build
        working-directory: frontend
        run: npm run build

  test-cross-platform:
    name: Backend unit tests (${{ matrix.os }})
    needs: [test-backend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev --extra cpu
      - name: Run unit tests
        run: uv run python -m pytest backend/tests/unit/ -v

  # ── Stage 2: E2E tests ───────────────────────────────────────────────────
  e2e:
    name: E2E tests (Playwright)
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install Python dependencies
        run: uv sync --extra dev --extra cpu
      - name: Install root dependencies
        run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Cache ONNX models
        id: cache-onnx
        uses: actions/cache@v6
        with:
          path: data/models/small
          key: onnx-models-small-${{ hashFiles('backend/app/services/model_registry.py') }}
      - name: Download ONNX model from HuggingFace
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        run: uv run python scripts/models/setup_models.py
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: "true"
          E2E_IMAGE_KEY: ${{ secrets.E2E_IMAGE_KEY }}
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results/
          retention-days: 14

  # ── Stage 3: Multi-platform Electron builds ───────────────────────────────
  # GPU strategy per platform:
  #   Windows: onnxruntime-directml (all DirectX 12 GPUs, ~20 MB overhead)
  #   macOS:   onnxruntime (CoreML built-in on Apple Silicon, zero overhead)
  #   Linux:   onnxruntime (CPU only — CUDA provider too large for desktop)
  build:
    needs: [e2e, test-cross-platform]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            ort_extra: gpu-directml
          - os: macos-latest
            platform: macos
            arch: arm64
            ort_extra: cpu
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            ort_extra: cpu

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require a version to publish
        if: inputs.publish && inputs.version == ''
        shell: bash
        run: |
          echo "::error::Set the version input to publish a release"
          exit 1

      - name: Require a reason to accept search changes
        if: inputs.accept_search_changes && inputs.search_change_reason == ''
        shell: bash
        run: |
          echo "::error::Set search_change_reason to say why search results are expected to change"
          exit 1

      # ── Set version from input ──────────────────────────────────────────
      - name: Set version
        if: inputs.publish && inputs.version != ''
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.RELEASE_VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('frontend/package.json', 'utf8'));
            pkg.version = process.env.RELEASE_VERSION;
            fs.writeFileSync('frontend/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # ── Python / uv setup ──────────────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 'latest'

      - name: Set up Python
        run: uv python install 3.12

      # The build scripts are stdlib-only (--no-project); build_sidecar.py syncs its
      # own runtime-only venv (.venv-sidecar) for PyInstaller.

      # ── Linux system dependencies ────────────────────────────────────────
      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      # ONNX models are downloaded at runtime by the app (no build-time bundling)

      # ── Node.js setup ────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root Node dependencies
        run: npm ci

      - name: Install frontend Node dependencies
        run: npm ci
        working-directory: frontend

      # ── Build frontend ───────────────────────────────────────────────────
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # ── Build Python sidecar (bundles frontend/dist) ─────────────────────
      - name: Build sidecar
        run: uv run --no-project python scripts/build/build_sidecar.py --ort-extra ${{ matrix.ort_extra }}

      - name: Smoke-test sidecar
        run: uv run --no-project python scripts/build/smoke_sidecar.py

      # ── Build Electron app ───────────────────────────────────────────────
      # Signed (macOS) whether or not this run publishes, so the artifacts verified
      # in a dry run are the ones that get released. Unsigned while the signing secrets
      # aren't set: an unset secret arrives as an empty string, which electron-builder
      # reads as a path (CSC_LINK="" fails with "<repo> not a file"), so empty ones are
      # unset first.
      - name: Build Electron app
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          for var in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!var}" ] || unset "$var"
          done
          if [ "$TARGET_PLATFORM" = macos ] && [ -z "${CSC_LINK:-}" ]; then
            echo "::warning::macOS signing secrets not set; the app will be unsigned and not notarized"
          fi
          uv run --no-project python scripts/build/build_electron.py --skip-sidecar --skip-frontend --platform "$TARGET_PLATFORM"

      # The packaged app's windows and sidecar lifecycle (e2e/packaged). Windows only
      # for now: the specs are cross-platform but have only been run there.
      - name: Test packaged app
        if: matrix.platform == 'windows'
        run: npm run test:packaged

      - name: Upload packaged-app test report
        if: failure() && matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: packaged-test-report-${{ matrix.platform }}
          path: e2e/playwright-report-packaged/
          retention-days: 7

      # ── Upgrade test (design/testing.md#upgrade-test) ────────────────────
      # The same code packaged as version 0.0.0 is installed, given a library, and
      # updated to this build from a local feed. The library and its search results
      # are compared before and after. Windows only for now.
      - name: Build the old version for the upgrade test
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          npx electron-builder --win nsis --publish never \
            -c.extraMetadata.version=0.0.0 -c.directories.output=dist-upgrade-old
          version=$(node -p "require('./package.json').version")
          mkdir dist-upgrade-feed
          cp dist-electron/latest.yml "dist-electron/Scene-Atlas-Setup-$version.exe" \
            "dist-electron/Scene-Atlas-Setup-$version.exe.blockmap" dist-upgrade-feed/
          # The old build's blockmap lets the app download only the blocks that changed.
          cp dist-upgrade-old/Scene-Atlas-Setup-0.0.0.exe.blockmap dist-upgrade-feed/
          echo "UPGRADE_NEW_VERSION=$version" >> "$GITHUB_ENV"

      - name: Cache the search model for the upgrade test
        if: matrix.platform == 'windows'
        uses: actions/cache@v6
        with:
          path: .upgrade-model-cache
          key: upgrade-model-small-${{ hashFiles('backend/app/services/model_registry.py') }}

      - name: Upgrade test
        if: matrix.platform == 'windows'
        run: npm run test:upgrade
        env:
          UPGRADE_OLD_INSTALLER: ${{ github.workspace }}\dist-upgrade-old\Scene-Atlas-Setup-0.0.0.exe
          UPGRADE_FEED_DIR: ${{ github.workspace }}\dist-upgrade-feed
          UPGRADE_MODEL_CACHE: ${{ github.workspace }}\.upgrade-model-cache
          ACCEPT_SEARCH_CHANGES: ${{ inputs.accept_search_changes }}
          SEARCH_CHANGE_REASON: ${{ inputs.search_change_reason }}
          E2E_IMAGE_KEY: ${{ secrets.E2E_IMAGE_KEY }}

      - name: Upload upgrade test report
        if: always() && matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-test-report
          path: |
            e2e/upgrade-report/
            e2e/playwright-report-upgrade/
          if-no-files-found: ignore
          retention-days: 30

      # ── Upload artifacts ─────────────────────────────────────────────────
      # The installers plus electron-updater's metadata (latest*.yml, blockmaps), which
      # the publish job uploads with them (design/electron.md#updates).
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: scene-atlas-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.blockmap
            dist-electron/latest*.yml
          if-no-files-found: error
          retention-days: 30

  # ── Stage 4: Publish ──────────────────────────────────────────────────────
  # One release from all three builds, created only once every build has passed
  # (the build matrix doesn't fail fast, so publishing from it could release a
  # partial set). The installers go up with electron-updater's metadata, which the
  # installed apps read to find the release (design/electron.md#updates).
  publish:
    name: Publish GitHub Release
    needs: [build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      # First: checkout cleans the workspace, which would delete release/.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 'latest'

      - name: Download installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'scene-atlas-*' --dir release

      # A mismatch between latest*.yml and the uploaded files breaks every installed
      # app's update, so it stops the release (design/testing.md#update-metadata-check).
      - name: Verify update metadata
        env:
          VERSION: ${{ inputs.version }}
        run: uv run --no-project --with pyyaml python scripts/release/verify_update_metadata.py --dir release --version "$VERSION"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          ACCEPT_SEARCH_CHANGES: ${{ inputs.accept_search_changes }}
          SEARCH_CHANGE_REASON: ${{ inputs.search_change_reason }}
        run: |
          notes=()
          if [ "$ACCEPT_SEARCH_CHANGES" = true ]; then
            notes=(--notes "Search results change in this release: $SEARCH_CHANGE_REASON")
          fi
          gh release create "v$VERSION" release/*/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Scene Atlas $VERSION" \
            "${notes[@]}" \
            --generate-notes
