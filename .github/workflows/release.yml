name: Release

# Manual-only release pipeline (design/releasing.md).
# Stages: version check → full test suite → E2E → Electron builds and Docker image → publish.
#
# Releasing:
#   1. Bump the version in a PR (scripts/release/release_version.py bump 0.2.0) and merge it
#   2. Run this workflow against main with publish=true. Without it, everything runs
#      except the publish: a check of main between releases.
#   3. It creates a draft release v<version> from this run's own builds, and pushes the
#      Docker image as sha-<commit>. Installed apps and `latest` ignore drafts.
#   4. Check the draft's installers, then publish it on GitHub. Publishing tags the
#      Docker image with the version (release-published.yml).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Releases'
        type: boolean
        default: false
      # The upgrade test compares search results before and after updating
      # (design/testing.md#upgrade-test). Library problems always fail it.
      accept_search_changes:
        description: 'Accept changed search results in the upgrade test (needs a reason)'
        type: boolean
        default: false
      search_change_reason:
        description: 'Why search results changed — shown in the test report and the release notes'
        type: string
        required: false

# Read-only by default; the publish and docker jobs ask for what they need.
permissions:
  contents: read

# One release run at a time: two could race to create the same draft.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Stage 0: The version ──────────────────────────────────────────────────
  # Seconds, before an hour of tests and builds: the version comes from the repo
  # (package.json and backend/__init__.py, which must agree) and, to publish, must be
  # newer than every release tag. Publishing only happens from main.
  preflight:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Publish only from main
        if: inputs.publish && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Publish from main, not $GITHUB_REF_NAME"
          exit 1

      - name: Require a reason to accept search changes
        if: inputs.accept_search_changes && inputs.search_change_reason == ''
        run: |
          echo "::error::Set search_change_reason to say why search results are expected to change"
          exit 1

      - name: Check the version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=()
          if [ "$PUBLISH" = true ]; then args=(--publish); fi
          python3 scripts/release/release_version.py check "${args[@]}"

  # ── Stage 1: Full test suite ──────────────────────────────────────────────
  test-backend:
    name: Backend tests
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev --extra cpu
      - name: Backend lint
        run: uv run ruff check backend/
      - name: Backend format check
        run: uv run ruff format --check backend/
      - name: Backend unit tests
        run: uv run python -m pytest backend/tests/unit/ -v
      - name: Cache ONNX models (small)
        id: cache-onnx
        uses: actions/cache@v6
        with:
          path: data/models/small
          key: onnx-models-small-${{ hashFiles('backend/app/services/model_registry.py') }}
      - name: Download ONNX model
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        run: uv run python scripts/models/setup_models.py
        env:
          EMBEDDING_MODEL: small
      - name: Backend integration tests
        run: >
          uv run python -m pytest backend/tests/integration/ -v
          || test $? -eq 134
        env:
          EMBEDDING_MODEL: small
      - name: Backend heavy tests (real CLIP)
        run: uv run python -m pytest -m heavy -v

  test-frontend:
    name: Frontend tests
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npx eslint . --ext ts,tsx --report-unused-disable-directives --max-warnings 0
      - name: Prettier check
        working-directory: frontend
        run: npx prettier --check src/
      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Unit tests with coverage
        working-directory: frontend
        run: npx vitest run --coverage
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 14
      - name: Production build
        working-directory: frontend
        run: npm run build

  test-cross-platform:
    name: Backend unit tests (${{ matrix.os }})
    needs: [test-backend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev --extra cpu
      - name: Run unit tests
        run: uv run python -m pytest backend/tests/unit/ -v

  # ── Stage 2: E2E tests ───────────────────────────────────────────────────
  e2e:
    name: E2E tests (Playwright)
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install Python dependencies
        run: uv sync --extra dev --extra cpu
      - name: Install root dependencies
        run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Cache ONNX models
        id: cache-onnx
        uses: actions/cache@v6
        with:
          path: data/models/small
          key: onnx-models-small-${{ hashFiles('backend/app/services/model_registry.py') }}
      - name: Download ONNX model from HuggingFace
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        run: uv run python scripts/models/setup_models.py
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: "true"
          E2E_IMAGE_KEY: ${{ secrets.E2E_IMAGE_KEY }}
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results/
          retention-days: 14

  # ── Stage 3: Multi-platform Electron builds ───────────────────────────────
  # GPU strategy per platform:
  #   Windows: onnxruntime-directml (all DirectX 12 GPUs, ~20 MB overhead)
  #   macOS:   onnxruntime (CoreML built-in on Apple Silicon, zero overhead)
  #   Linux:   onnxruntime (CPU only — CUDA provider too large for desktop)
  build:
    needs: [preflight, e2e, test-cross-platform]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            ort_extra: gpu-directml
          - os: macos-latest
            platform: macos
            arch: arm64
            ort_extra: cpu
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            ort_extra: cpu

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ── Python / uv setup ──────────────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 'latest'

      - name: Set up Python
        run: uv python install 3.12

      # The build scripts are stdlib-only (--no-project); build_sidecar.py syncs its
      # own runtime-only venv (.venv-sidecar) for PyInstaller.

      # ── Linux system dependencies ────────────────────────────────────────
      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      # ONNX models are downloaded at runtime by the app (no build-time bundling)

      # ── Node.js setup ────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root Node dependencies
        run: npm ci

      - name: Install frontend Node dependencies
        run: npm ci
        working-directory: frontend

      # ── Build frontend ───────────────────────────────────────────────────
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # ── Build Python sidecar (bundles frontend/dist) ─────────────────────
      - name: Build sidecar
        run: uv run --no-project python scripts/build/build_sidecar.py --ort-extra ${{ matrix.ort_extra }}

      - name: Smoke-test sidecar
        run: uv run --no-project python scripts/build/smoke_sidecar.py

      # ── Build Electron app ───────────────────────────────────────────────
      # Signed (macOS) whether or not this run publishes, so a run without publish
      # builds what a release would. Unsigned while the signing secrets
      # aren't set: an unset secret arrives as an empty string, which electron-builder
      # reads as a path (CSC_LINK="" fails with "<repo> not a file"), so empty ones are
      # unset first.
      - name: Build Electron app
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          for var in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!var}" ] || unset "$var"
          done
          if [ "$TARGET_PLATFORM" = macos ] && [ -z "${CSC_LINK:-}" ]; then
            echo "::warning::macOS signing secrets not set; the app will be unsigned and not notarized"
          fi
          uv run --no-project python scripts/build/build_electron.py --skip-sidecar --skip-frontend --platform "$TARGET_PLATFORM"

      # The packaged app's windows and sidecar lifecycle (e2e/packaged). Windows only
      # for now: the specs are cross-platform but have only been run there.
      - name: Test packaged app
        if: matrix.platform == 'windows'
        run: npm run test:packaged

      - name: Upload packaged-app test report
        if: failure() && matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: packaged-test-report-${{ matrix.platform }}
          path: e2e/playwright-report-packaged/
          retention-days: 7

      # ── Upgrade test (design/testing.md#upgrade-test) ────────────────────
      # An older version is installed, given a library, and updated to this build from a
      # local feed. The library and its search results are compared before and after.
      # Twice: from the same code packaged as 0.0.0, and from the last published release
      # (its own updater, and migrations on a database it made). Windows only for now.
      - name: Build the old version for the upgrade test
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          npx electron-builder --win nsis --publish never \
            -c.extraMetadata.version=0.0.0 -c.directories.output=dist-upgrade-old
          version=$(node -p "require('./package.json').version")
          mkdir dist-upgrade-feed
          cp dist-electron/latest.yml "dist-electron/Scene-Atlas-Setup-$version.exe" \
            "dist-electron/Scene-Atlas-Setup-$version.exe.blockmap" dist-upgrade-feed/
          # The old build's blockmap lets the app download only the blocks that changed.
          cp dist-upgrade-old/Scene-Atlas-Setup-0.0.0.exe.blockmap dist-upgrade-feed/
          echo "UPGRADE_NEW_VERSION=$version" >> "$GITHUB_ENV"

      # The encrypted test images are in Git LFS, which the checkout above leaves as a
      # pointer file (the other builds don't need them).
      - name: Fetch the test images for the upgrade test
        if: matrix.platform == 'windows'
        run: git lfs pull --include "e2e/fixtures/e2e-images.zip.enc"

      - name: Cache the search model for the upgrade test
        if: matrix.platform == 'windows'
        uses: actions/cache@v6
        with:
          path: .upgrade-model-cache
          key: upgrade-model-small-${{ hashFiles('backend/app/services/model_registry.py') }}

      - name: Upgrade test
        if: matrix.platform == 'windows'
        run: npm run test:upgrade
        env:
          UPGRADE_OLD_INSTALLER: ${{ github.workspace }}\dist-upgrade-old\Scene-Atlas-Setup-0.0.0.exe
          UPGRADE_FEED_DIR: ${{ github.workspace }}\dist-upgrade-feed
          UPGRADE_MODEL_CACHE: ${{ github.workspace }}\.upgrade-model-cache
          ACCEPT_SEARCH_CHANGES: ${{ inputs.accept_search_changes }}
          SEARCH_CHANGE_REASON: ${{ inputs.search_change_reason }}
          E2E_IMAGE_KEY: ${{ secrets.E2E_IMAGE_KEY }}

      # The latest published release (not drafts or prereleases), if there is one.
      - name: Download the last release for the upgrade test
        id: previous
        if: matrix.platform == 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "::notice::No published release yet, so no upgrade test from one"
            exit 0
          fi
          previous="${tag#v}"
          # A run that doesn't publish can build the last release's own version (main
          # between releases); a publishing run's version is always newer (preflight).
          if [ "$previous" = "$UPGRADE_NEW_VERSION" ]; then
            echo "::notice::This build is $tag's own version, so no upgrade test from it"
            exit 0
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist-upgrade-previous \
            --pattern "Scene-Atlas-Setup-$previous.exe" --pattern "Scene-Atlas-Setup-$previous.exe.blockmap"
          mkdir dist-upgrade-feed-previous
          cp dist-upgrade-feed/latest.yml "dist-upgrade-feed/Scene-Atlas-Setup-$UPGRADE_NEW_VERSION.exe" \
            "dist-upgrade-feed/Scene-Atlas-Setup-$UPGRADE_NEW_VERSION.exe.blockmap" \
            "dist-upgrade-previous/Scene-Atlas-Setup-$previous.exe.blockmap" dist-upgrade-feed-previous/
          echo "version=$previous" >> "$GITHUB_OUTPUT"

      - name: Upgrade test from the last release
        if: steps.previous.outputs.version != ''
        run: npm run test:upgrade
        env:
          UPGRADE_OLD_INSTALLER: ${{ github.workspace }}\dist-upgrade-previous\Scene-Atlas-Setup-${{ steps.previous.outputs.version }}.exe
          UPGRADE_FEED_DIR: ${{ github.workspace }}\dist-upgrade-feed-previous
          UPGRADE_MODEL_CACHE: ${{ github.workspace }}\.upgrade-model-cache
          UPGRADE_REPORT_DIR: ${{ github.workspace }}\e2e\upgrade-report-previous
          UPGRADE_PLAYWRIGHT_REPORT: playwright-report-upgrade-previous
          ACCEPT_SEARCH_CHANGES: ${{ inputs.accept_search_changes }}
          SEARCH_CHANGE_REASON: ${{ inputs.search_change_reason }}
          E2E_IMAGE_KEY: ${{ secrets.E2E_IMAGE_KEY }}

      - name: Upload upgrade test report
        if: always() && matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-test-report
          path: |
            e2e/upgrade-report/
            e2e/playwright-report-upgrade/
            e2e/upgrade-report-previous/
            e2e/playwright-report-upgrade-previous/
          if-no-files-found: ignore
          retention-days: 30

      # ── Upload artifacts ─────────────────────────────────────────────────
      # The installers plus electron-updater's metadata (latest*.yml, blockmaps), which
      # the publish job uploads with them (design/electron.md#updates).
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: scene-atlas-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.blockmap
            dist-electron/latest*.yml
          if-no-files-found: error
          retention-days: 30

  # ── Docker image (design/releasing.md#docker-image) ──────────────────────
  # The CPU server image, smoke-tested as an arbitrary user on a fresh volume. To publish,
  # it is pushed as sha-<commit> only: the version and latest tags are added when the
  # draft release is published (release-published.yml), so nothing pulls an unreleased one.
  docker:
    name: Docker image
    needs: [preflight, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build --build-arg "VERSION=$VERSION" --tag "$IMAGE:sha-$GITHUB_SHA" .

      - name: Smoke-test the image
        run: python3 scripts/build/smoke_docker.py --image "$IMAGE:sha-$GITHUB_SHA" --version "$VERSION" --compose docker-compose.yml

      - name: Push the image
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:sha-$GITHUB_SHA"

  # ── Stage 4: Draft release ────────────────────────────────────────────────
  # One draft release from all three builds, created only once every build has passed
  # (the build matrix doesn't fail fast, so publishing from it could release a partial
  # set). The installers go up with electron-updater's metadata, which installed apps read
  # once the draft is published (design/electron.md#updates), and the Docker Compose files
  # for server installs (docs/deploy/server.md).
  publish:
    name: Create the draft release
    needs: [preflight, build, docker]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      # First: checkout cleans the workspace, which would delete release/.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 'latest'

      - name: Download installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'scene-atlas-*' --dir release

      # A mismatch between latest*.yml and the uploaded files breaks every installed
      # app's update, so it stops the release (design/testing.md#update-metadata-check).
      - name: Verify update metadata
        run: uv run --no-project --with pyyaml python scripts/release/verify_update_metadata.py --dir release --version "$VERSION"

      # Added after the check, which would read docker-compose.yml as update metadata.
      # .env.example is renamed: GitHub doesn't keep a leading dot in an asset name.
      - name: Add the Docker Compose files
        run: |
          mkdir release/compose
          cp docker-compose.yml release/compose/docker-compose.yml
          cp .env.example release/compose/env.example

      # A re-run for the same version replaces the draft an earlier run left. A published
      # release is never touched (the version check stops that run before it gets here).
      - name: Replace an earlier draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"v$VERSION\" and .draft) | .id" |
          while read -r id; do
            echo "Deleting the earlier draft $id"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCEPT_SEARCH_CHANGES: ${{ inputs.accept_search_changes }}
          SEARCH_CHANGE_REASON: ${{ inputs.search_change_reason }}
        run: |
          notes="Docker: \`ghcr.io/$GITHUB_REPOSITORY:$VERSION\` ([updating a server](https://jennis0.github.io/scene-atlas/deploy/server#updating))"
          if [ "$ACCEPT_SEARCH_CHANGES" = true ]; then
            notes+=$'\n\n'"Search results change in this release: $SEARCH_CHANGE_REASON"
          fi
          flags=(--draft)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          url=$(gh release create "v$VERSION" release/*/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Scene Atlas $VERSION" \
            --notes "$notes" \
            --generate-notes \
            "${flags[@]}")
          {
            echo "## Draft release v$VERSION"
            echo
            echo "Check the installers on [the draft]($url), then publish it."
            echo "Publishing makes it the update for installed apps and tags the Docker image."
          } >> "$GITHUB_STEP_SUMMARY"
