name: CI

# PR-only: pre-push hook covers lint + unit tests locally.
# CI validates what can't easily run locally (security audit, integration tests, prod build).
#
# POST-OPEN-SOURCE: When the repo is public (unlimited minutes), restore:
#   - push trigger on [main]
#   - backend-lint, backend-unit, frontend-lint, frontend-test jobs
#   - backend-unit-cross-platform (windows + macOS)
#   - backend-heavy (real CLIP model)
#   - frontend-coverage
# These catch contributors who skip the pre-push hook.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-security:
    name: Backend security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        # --extra cpu so the shipped onnxruntime is audited too.
        run: uv sync --extra dev --extra cpu
      - name: pip-audit (Python CVE scan)
        # Blocking. Accepted risks (see design/security.md, "Accepted scanner findings"):
        # transformers <5 is a dev-only extra used by scripts/models to export trusted
        # checkpoints; it is excluded from the PyInstaller sidecar and never runs in the app.
        # transformers 5 is a major upgrade of the export pipeline, tracked separately.
        run: >
          uv run pip-audit --desc
          --ignore-vuln PYSEC-2025-217
          --ignore-vuln PYSEC-2026-2288
          --ignore-vuln PYSEC-2026-2289
          --ignore-vuln PYSEC-2026-2290
          --ignore-vuln PYSEC-2026-3929
          --ignore-vuln PYSEC-2026-4174
      - name: bandit (Python SAST)
        # Blocking. Accepted findings are suppressed inline with `# nosec BXXX` and a reason.
        run: uv run bandit -r backend/app backend/pipeline -ll

  backend-integration:
    name: Backend integration tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev --extra cpu
      - name: Cache ONNX models (small)
        id: cache-onnx
        uses: actions/cache@v6
        with:
          path: data/models/small
          key: onnx-models-small-${{ hashFiles('backend/app/services/model_registry.py') }}
      - name: Download ONNX model
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        run: uv run python scripts/models/setup_models.py
        env:
          SCENE_ATLAS_EMBEDDING_MODEL: small
      - name: Run unit tests with coverage
        # Tolerate exit 134 (SIGABRT): native C++ libs (torch, qdrant) can
        # crash during interpreter shutdown after all tests pass.
        run: >
          uv run python -m pytest backend/tests/unit/ --cov --cov-report=
          || test $? -eq 134
      - name: Run integration tests with coverage
        run: >
          uv run python -m pytest backend/tests/integration/ -v
          --cov --cov-append
          --cov-report=term-missing
          --cov-report=xml:coverage-backend.xml
          || test $? -eq 134
        env:
          SCENE_ATLAS_EMBEDDING_MODEL: small
      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-backend
          path: coverage-backend.xml
          retention-days: 14

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: npm audit (shipped frontend deps, high+)
        # Blocking for runtime deps only. Dev/build tooling findings are triaged in
        # design/security.md ("Accepted scanner findings") rather than gated here.
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript check + Vite build
        working-directory: frontend
        run: npm run build

  quality:
    name: Types, dead code, duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: uv sync --extra dev --extra cpu
      - name: pyright
        run: uvx pyright@1.1.414
        env:
          PYRIGHT_PYTHON_FORCE_VERSION: "1.1.414"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: knip (unused files, exports, dependencies)
        working-directory: frontend
        run: npm run knip
      - name: jscpd (duplication threshold in .jscpd.json)
        run: npx --yes jscpd@4.0.5 --silent
      - name: Install root dependencies (Playwright types for e2e/)
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: E2E type check (includes the docs screenshots' desktop stand-in)
        run: npx tsc -p e2e/tsconfig.json --noEmit
