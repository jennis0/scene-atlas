name: CI

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────

  backend-lint:
    name: Backend lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff check)
        run: uv run ruff check backend/

      - name: Format check (ruff format)
        run: uv run ruff format --check backend/

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run python -m pytest backend/tests/unit/ -v

  backend-unit-cross-platform:
    name: Backend unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: backend-unit
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run python -m pytest backend/tests/unit/ -v

  backend-integration:
    name: Backend integration tests + coverage
    runs-on: ubuntu-latest
    needs: backend-unit
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests with coverage
        # Tolerate exit 134 (SIGABRT): native C++ libs (torch, qdrant) can
        # crash during interpreter shutdown after all tests pass.
        run: >
          uv run python -m pytest backend/tests/unit/ --cov --cov-report=
          || test $? -eq 134

      - name: Run integration tests with coverage
        run: >
          uv run python -m pytest backend/tests/integration/ -v
          --cov --cov-append
          --cov-report=term-missing
          --cov-report=xml:coverage-backend.xml
          || test $? -eq 134

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: coverage-backend.xml
          retention-days: 14

  backend-heavy:
    name: Backend heavy tests (CLIP)
    runs-on: ubuntu-latest
    needs: backend-unit
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (including dev for torch/transformers)
        run: uv sync --extra dev

      - name: Cache ONNX models
        id: cache-onnx
        uses: actions/cache@v4
        with:
          path: backend/models/clip-vit-b-32
          key: onnx-models-${{ hashFiles('scripts/models/export_model_onnx.py', 'backend/app/config.py') }}

      - name: Cache HuggingFace models
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: huggingface-clip-${{ hashFiles('backend/app/config.py') }}
          restore-keys: |
            huggingface-clip-

      - name: Export ONNX models
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        run: uv run python scripts/models/setup_models.py

      - name: Run heavy tests (real CLIP model)
        run: uv run python -m pytest -m heavy -v

  # ── Frontend ───────────────────────────────────────────────────────────────

  frontend-lint:
    name: Frontend lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npx eslint . --ext ts,tsx --report-unused-disable-directives --max-warnings 0

      - name: Prettier check
        working-directory: frontend
        run: npx prettier --check src/

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npx vitest run

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check + Vite build
        working-directory: frontend
        run: npm run build

  # ── E2E (Playwright) ─────────────────────────────────────────────────────

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Cache ONNX models
        id: cache-onnx
        uses: actions/cache@v4
        with:
          path: backend/models/clip-vit-b-32
          key: onnx-models-${{ hashFiles('scripts/models/export_model_onnx.py', 'backend/app/config.py') }}

      - name: Cache HuggingFace models
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: huggingface-clip-${{ hashFiles('backend/app/config.py') }}
          restore-keys: |
            huggingface-clip-

      - name: Export ONNX models
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        run: uv run python scripts/models/setup_models.py

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results/
          retention-days: 14

  frontend-coverage:
    name: Frontend coverage
    runs-on: ubuntu-latest
    needs: frontend-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests with coverage
        working-directory: frontend
        run: npx vitest run --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 14
