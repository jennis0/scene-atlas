name: Build Electron App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Releases'
        type: boolean
        default: false

jobs:
  # ── Quick gate: lint + unit tests before expensive matrix build ──────────
  gate:
    name: Pre-build checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Backend lint
        run: uv run ruff check backend/

      - name: Backend unit tests
        run: uv run python -m pytest backend/tests/unit/ -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npx eslint . --ext ts,tsx --max-warnings 0

      - name: Frontend tests
        working-directory: frontend
        run: npx vitest run

  # ── Multi-platform build ─────────────────────────────────────────────────
  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: macos-13
            platform: macos
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }} (${{ matrix.arch }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Set version from tag ────────────────────────────────────────────
      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # Update root package.json version (used by electron-builder)
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          # Update frontend package.json version
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('frontend/package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('frontend/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # ── Python / uv setup ──────────────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      # ── Linux system dependencies ──────────────────────────────────────
      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      # ── Build Python sidecar ───────────────────────────────────────────
      - name: Build sidecar (CPU-only torch)
        run: uv run python scripts/build_sidecar.py
        env:
          # Force CPU-only torch to avoid bundling CUDA (~2GB)
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

      # ── Node.js setup ──────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root Node dependencies
        run: npm ci

      - name: Install frontend Node dependencies
        run: npm ci
        working-directory: frontend

      # ── Build frontend ─────────────────────────────────────────────────
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # ── Compile Electron TypeScript ────────────────────────────────────
      - name: Compile Electron main process
        run: npx tsc -p electron/tsconfig.json

      # ── Build Electron app ─────────────────────────────────────────────
      - name: Build Electron app (publish)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish == 'true'
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (optional — set these secrets to enable signing)
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Electron app (no publish)
        if: "!(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && github.event.inputs.publish != 'true'"
        run: npx electron-builder --publish never

      # ── Upload artifacts ───────────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scene-atlas-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-electron/*.exe
            dist-electron/*.msi
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.deb
          if-no-files-found: warn
          retention-days: 30
