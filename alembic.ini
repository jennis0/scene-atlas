# Alembic configuration for Scene Atlas.
# Used by `alembic` CLI and by the programmatic API in init_db().

[alembic]
# Path to migration scripts, relative to this file
script_location = backend/alembic

# Database URL — overridden programmatically in env.py via settings.
# Set this here for CLI use: `uv run alembic upgrade head`
sqlalchemy.url = sqlite:///./data/battlemap.db

# Migration file naming
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
