<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src 'self'"
    />
    <title>Scene Atlas</title>
    <style>
      /* The app's fonts, bundled beside this page like setup.html's (OFL, see fonts/). */
      @font-face {
        font-family: 'Cinzel';
        font-weight: 400 900;
        font-display: swap;
        src: url(fonts/cinzel-latin-wght.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Figtree';
        font-weight: 300 900;
        font-display: swap;
        src: url(fonts/figtree-latin-wght.woff2) format('woff2');
      }
      /* The app's navy palette (frontend/src/index.css); follows the system theme, since
         the user's own choice lives in the app, which isn't loaded yet. */
      :root {
        color-scheme: light;
        --bg: hsl(36 28% 91%);
        --surface: hsl(36 26% 94%);
        --border: hsl(36 14% 78%);
        --primary: hsl(38 72% 50%);
        --fg: hsl(30 12% 15%);
        --mark-page: hsl(222 22% 8%);
        --fg-muted: hsl(30 9% 34%);
        --danger: hsl(0 65% 35%);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: hsl(222 22% 8%);
          --surface: hsl(222 22% 12%);
          --border: hsl(220 18% 19%);
          --primary: hsl(39 70% 55%);
          --fg: hsl(37 27% 89%);
          --mark-page: var(--fg);
          --fg-muted: hsl(37 9% 58%);
          --danger: hsl(0 75% 73.5%);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          'Figtree',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        /* The window is frameless; let the user drag it from anywhere but the error panel. */
        -webkit-app-region: drag;
      }
      main {
        width: 100%;
        max-width: 560px;
        text-align: center;
      }
      .mark {
        display: block;
        height: 36px;
        width: auto;
        margin: 0 auto 16px;
      }
      .mark-band {
        fill: var(--primary);
      }
      .mark-page {
        fill: var(--mark-page);
      }
      h1 {
        font-family: 'Cinzel', Georgia, 'Times New Roman', serif;
        font-weight: 500;
        letter-spacing: 0.08em;
        font-size: 26px;
        margin: 0 0 6px;
      }
      .rule {
        width: 28px;
        height: 1px;
        margin: 0 auto 20px;
        background: var(--primary);
      }
      #status {
        color: var(--fg-muted);
        font-size: 14px;
        margin: 0;
      }
      #error {
        display: none;
        text-align: left;
        -webkit-app-region: no-drag;
      }
      #error p {
        color: var(--danger);
        font-size: 14px;
        margin: 0 0 12px;
      }
      pre {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        max-height: 260px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        color: var(--fg-muted);
        user-select: text;
      }
      .hint {
        color: var(--fg-muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- brand-mark --><svg class="mark" viewBox="52 126 409 304" aria-hidden="true" focusable="false"><path class="mark-band" d="M52.0,360.1 C112.0,334.9 210.0,343.3 251.0,397.9 L251.0,429.9 C210.0,375.3 112.0,366.9 52.0,392.1 Z"/><path class="mark-band" d="M460.0,360.1 C400.0,334.9 302.0,343.3 261.0,397.9 L261.0,429.9 C302.0,375.3 400.0,366.9 460.0,392.1 Z"/><path class="mark-page" d="M52.0,140.1 C112.0,114.9 210.0,123.3 251.0,177.9 L251.0,383.9 C210.0,329.3 112.0,320.9 52.0,346.1 Z"/><path class="mark-page" d="M460.0,140.1 C400.0,114.9 302.0,123.3 261.0,177.9 L261.0,383.9 C302.0,329.3 400.0,320.9 460.0,346.1 Z"/></svg><!-- /brand-mark -->
      <h1>Scene Atlas</h1>
      <div class="rule"></div>
      <p id="status" role="status">Starting up…</p>
      <div id="error">
        <p id="summary" role="alert"></p>
        <pre id="detail"></pre>
        <p class="hint">
          Restart Scene Atlas to try again. The full log is at the path shown above.
        </p>
      </div>
    </main>
    <script>
      const status = document.getElementById('status')
      const slow = setTimeout(() => {
        status.textContent = 'First launch takes a little longer than usual…'
      }, 15000)

      // Prefer the last Python exception message in the output (e.g. "another backend is
      // using this data folder"); otherwise the first line ("Backend exited during startup").
      const EXCEPTION_LINE = /^(?:\[backend(?::err)?\] )?(?:[A-Za-z_][\w.]*\.)?\w*(?:Error|Exception): (.+)$/
      function summarise(raw) {
        const lines = raw.split('\n').map((l) => l.trim())
        for (let i = lines.length - 1; i >= 0; i--) {
          const match = EXCEPTION_LINE.exec(lines[i])
          if (match) return match[1]
        }
        return lines[0]
      }

      window.electronAPI?.onBackendError((message) => {
        clearTimeout(slow)
        status.style.display = 'none'
        // Shown before the text is set, so screen readers announce the alert.
        document.getElementById('error').style.display = 'block'
        document.getElementById('summary').textContent = summarise(message)
        document.getElementById('detail').textContent = message
      })
    </script>
  </body>
</html>
