[project]
name = "scene-atlas"
version = "0.1.0"
description = "Scene Atlas — tabletop RPG scene manager with semantic search"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0,<1.0",
    "uvicorn[standard]>=0.27.0,<1.0",
    "prefect>=3.0.0,<4.0",
    "qdrant-client>=1.7.0,<2.0",
    "sqlalchemy>=2.0.25,<3.0",
    "alembic>=1.13.0,<2.0",
    "pillow>=10.2.0,<12.0",
    "opencv-python>=4.9.0,<5.0",
    "onnxruntime>=1.16.0,<2.0",
    "tokenizers>=0.15.0,<1.0",
    "numpy>=1.26.0,<3.0",
    "pydantic>=2.5.0,<3.0",
    "pydantic-settings>=2.1.0,<3.0",
    "python-multipart>=0.0.6,<1.0",
    "aiofiles>=23.2.0,<25.0",
    "pyyaml>=6.0.1,<7.0",
    "scikit-learn>=1.4.0,<2.0",
    "scipy>=1.12.0,<2.0",
    "zipstream-ng>=1.7.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.26.0",
    "pyinstaller",
    "torch>=2.1.0,<3.0",
    "transformers>=4.36.0,<5.0",
    "onnx>=1.14.0,<2.0",   # ONNX export + quantisation tools (dev only)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "G",   # flake8-logging-format
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"backend/tests/conftest.py" = ["E402"]  # intentional late imports for mock setup
"backend/scripts/*" = ["E402"]  # sys.path manipulation before imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "backend/tests/unit",
    "backend/tests/integration",
]
addopts = "--ignore=backend/tests/legacy --ignore=backend/tests/e2e -m 'not heavy'"
markers = [
    "heavy: tests requiring heavy infrastructure (CLIP model, real Qdrant, etc.) — run with -m heavy",
]
filterwarnings = [
    # SQLAlchemy internally uses datetime.utcnow() — not our code, not actionable
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["backend/app", "backend/pipeline"]
omit = [
    "backend/tests/*",
    "backend/alembic/*",
    "backend/pipeline/backfill_content_hash.py",
    "backend/pipeline/export_library.py",
    "backend/pipeline/fix_orphaned_images.py",
    "backend/pipeline/reparse_names.py",
    "backend/pipeline/retag_all_images.py",
    "backend/pipeline/write_new_embeddings.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 40
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.8",
    "onnx>=1.14.0,<2.0",      # ONNX export + quantisation tools
    "onnxscript>=0.6.0",      # Required by torch.onnx.export (newer torch versions)
]
