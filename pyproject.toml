[project]
name = "scene-atlas"
version = "0.1.0"
description = "Scene Atlas — tabletop RPG scene manager with semantic search"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0,<1.0",
    "uvicorn[standard]>=0.27.0,<1.0",
    "sqlalchemy>=2.0.25,<3.0",
    "alembic>=1.13.0,<2.0",
    "pillow>=10.2.0,<14.0",
    "opencv-python-headless>=4.9.0,<6.0",
    "tokenizers>=0.15.0,<1.0",
    "sentencepiece>=0.2.0,<1.0",
    "numpy>=1.26.0,<3.0",
    "pydantic>=2.5.0,<3.0",
    "pydantic-settings>=2.1.0,<3.0",
    "python-multipart>=0.0.6,<1.0",
    "aiofiles>=23.2.0,<26.0",
    "pyyaml>=6.0.1,<7.0",
    "scipy>=1.12.0,<2.0",
    "zipstream-ng>=1.7.0,<2.0",
    "psutil>=5.9.0,<8.0",
    "slowapi>=0.1.9,<1.0",
    "huggingface-hub>=0.20.0",
    "lancedb>=0.30.0,<1.0",
]

[project.optional-dependencies]
# Runtime extras — pick exactly one:
#   uv sync --extra cpu                     (CPU inference)
#   uv sync --extra gpu                     (NVIDIA CUDA inference)
#   uv sync --extra gpu-directml            (DirectX 12 inference, Windows)
# Dev extras — adds torch for model export scripts:
#   uv sync --extra cpu-dev --extra dev     (CPU + dev tools)
#   uv sync --extra gpu-dev --extra dev     (CUDA + dev tools)
#
# ORT >= 1.24 everywhere: the medium model uses 4-bit MatMulNBits weights, which
# ORT 1.19 cannot run (NaN outputs on 4-bit, no 8-bit kernel at all).
# onnxruntime-gpu is installed on its own (it bundles the Python API); installing it
# alongside the base onnxruntime package is what broke the ABI at 1.24.3
# (undefined symbol: Provider_GetHost). Standalone 1.22-1.31 verified on CUDA 2026-10-16.
cpu = [
    "onnxruntime>=1.24.0,<2.0",
]
cpu-dev = [
    "onnxruntime>=1.24.0,<2.0",
    "torch>=2.13.0,<3.0",
]
gpu = [
    "onnxruntime-gpu>=1.24.1,<2.0",
]
gpu-dev = [
    "onnxruntime-gpu>=1.24.1,<2.0",
    "torch>=2.13.0,<3.0",
]
gpu-directml = ["onnxruntime-directml>=1.24.0,<2.0"]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.26.0",
    "transformers>=5.10.0,<6.0",
    "onnx>=1.14.0,<2.0",   # ONNX export + quantisation tools (dev only)
    "tqdm>=4.60.0",
    "pip-audit>=2.7.0",    # CI: Python CVE scanning
    "bandit>=1.7.0",       # CI: Python SAST
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.8",
    "huggingface-hub[hf-xet]>=0.20.0", # Publish ONNX models to HF Hub
    "onnxscript>=0.6.0",      # Required by torch.onnx.export (newer torch versions)
    "scikit-learn>=1.4.0,<2.0",  # Grid model training (scripts/models/grid)
]

[dependency-groups]
# The desktop sidecar's build tool. scripts/build/build_sidecar.py installs it into
# .venv-sidecar with the runtime deps only (no dev extra), so nothing else is bundled.
sidecar = ["pyinstaller>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "G",   # flake8-logging-format
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PIE", # flake8-pie
    "S",   # flake8-bandit (security; replaces Bandit on Codacy)
    "RUF100",  # unused noqa
    "TRY400",  # logger.exception (keeps the traceback) inside except blocks
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"backend/tests/conftest.py" = ["E402"]  # storage roots are set before backend imports
"backend/scripts/*" = ["E402"]  # sys.path manipulation before imports
# Tests assert, spawn helper processes and use throwaway temp paths / randomness.
"{backend/tests,stress_tests,e2e}/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "S607"]
# Dev/build tooling runs fixed commands (git, npm, uv) from the developer's PATH.
"scripts/**" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "backend/tests/unit",
    "backend/tests/integration",
]
addopts = "-m 'not heavy'"
markers = [
    "heavy: tests requiring heavy infrastructure (CLIP model, real LanceDB, etc.) — run with -m heavy",
]
filterwarnings = [
    # SQLAlchemy internally uses datetime.utcnow() — not our code, not actionable
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning",
    # sentencepiece SWIG bindings missing __module__ — upstream issue
    "ignore:builtin type Swig.*has no __module__ attribute:DeprecationWarning",
]

[tool.coverage.run]
source = ["backend/app", "backend/pipeline"]
omit = [
    "backend/tests/*",
    "backend/alembic/*",
    "backend/pipeline/backfill_content_hash.py",
    "backend/pipeline/export_library.py",
    "backend/pipeline/fix_orphaned_images.py",
    "backend/pipeline/reparse_names.py",
    "backend/pipeline/retag_all_images.py",
    "backend/pipeline/write_new_embeddings.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 40
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.uv]
# Pick one runtime variant. cpu/cpu-dev conflict with gpu/gpu-dev/gpu-directml.
# cpu and cpu-dev can't coexist (torch source index differs from default).
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cpu-dev" },
        { extra = "gpu" },
        { extra = "gpu-dev" },
        { extra = "gpu-directml" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cuda", extra = "gpu-dev" },
    { index = "pytorch-cpu", extra = "cpu-dev" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url  = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url  = "https://download.pytorch.org/whl/cu126"
explicit = true

